name: servicehponline
description: "Aplikasi Service HP Online untuk mempermudah service perangkat anda"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.6.0
  flutter_svg: ^2.0.9
  flutter_bloc: ^8.1.3
  shared_preferences: ^2.2.2
  equatable: ^2.0.5
  flutter_screenutil: ^5.9.0
  flip_card: ^0.7.0
  url_launcher: ^6.2.2
  firebase_auth: ^4.15.3
  google_sign_in: ^6.2.2
  firebase_core: ^2.24.2
  image_picker: ^1.0.5
  http: ^1.1.2
  provider: ^6.1.1
  intl: ^0.18.1
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/devices/
    - assets/svg/login/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app-logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app-logo.png"
