name: servicehponline
description: "Service HP Online: Panggil Saja!"
publish_to: 'none'

version: 1.3.1+10

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.6.0
  flutter_svg: ^2.0.9
  flutter_bloc: ^8.1.3
  shared_preferences: ^2.2.2
  equatable: ^2.0.5
  flutter_screenutil: ^5.9.0
  flip_card: ^0.7.0
  url_launcher: ^6.2.2
  firebase_auth: ^4.15.3
  google_sign_in: ^6.2.2
  firebase_core: ^2.32.0
  image_picker: ^1.0.5
  http: ^1.1.2
  provider: ^6.1.1
  intl: ^0.20.2
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  flutter_dotenv: ^5.1.0
  js: ^0.6.7
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  awesome_dialog: ^3.2.0
  supabase_flutter: ^2.3.4
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.15.0
  webview_flutter_wkwebview: ^3.12.0
  flutter_image_compress: ^2.1.0
  video_compress: ^3.1.2
  path_provider: ^2.1.2
  crypto: ^3.0.3
  google_maps_flutter: ^2.10.0
  video_player: ^2.9.2
  pattern_lock: ^2.0.0
  cached_network_image: ^3.3.1
  photo_view: ^0.14.0
  chewie: ^1.7.5
  path: ^1.8.3
  package_info_plus: ^4.2.0
  dio: ^5.4.0
  open_filex: ^4.3.4
  file_selector: ^0.9.5
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: 0.11.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/devices/
    - assets/svg/login/
    - assets/svg/login/facebook.svg
    - assets/svg/login/google.svg
    - assets/svg/login/whatsapp_login.svg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app-logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app-logo.png"
